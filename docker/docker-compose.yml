version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sgbe_postgres
    environment:
      POSTGRES_USER: sgbe_admin
      POSTGRES_PASSWORD: sgbe_secret
      POSTGRES_DB: sgbe_vision
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

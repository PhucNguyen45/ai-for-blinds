# Chạy: docker compose up --build   →   http://localhost:8000/docs
# VLM_MODE=ai: đặt VLM_MODE=ai trong backend/.env; cấu hình mô hình (VLM_PROVIDER, khóa) lấy từ ai/.env.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env
        required: false
      - path: ai/.env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts:ro
    restart: unless-stopped

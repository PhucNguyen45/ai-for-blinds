# Chạy: docker compose up --build   →   http://localhost:8000/docs
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts:ro
    restart: unless-stopped

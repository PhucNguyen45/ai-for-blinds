name: ai_for_blinds
description: "An accessibility-first mobile app to help blind students study independently."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0
  record: ^5.2.0
  audioplayers: ^6.1.0
  provider: ^6.1.2
  path_provider: ^2.1.5
  intl: ^0.20.2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - 'prompts/**'
      - 'scripts/**'
      - 'data/library/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'prompts/**'
      - 'scripts/**'
      - 'data/library/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-dev.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 backend/app backend/tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check Python syntax
        run: python -m compileall -q backend/app backend/tests scripts

      - name: Run tests
        working-directory: backend
        env:
          VLM_MODE: mock
          STT_MODE: mock
        run: pytest -q

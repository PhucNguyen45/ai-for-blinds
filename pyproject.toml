[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-for-blinds"
version = "1.0.0"
description = "AI-powered learning assistant for blind students"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "Pillow>=11.0",
    "edge-tts>=7.0",
    "google-generativeai>=0.8.3",
    "pydantic-settings>=2.6",
]

[tool.setuptools.packages.find]
include = ["app*", "backend*"]

[tool.pyright]
venvPath = "backend"
venv = ".venv"
extraPaths = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["backend/tests", "app/tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
